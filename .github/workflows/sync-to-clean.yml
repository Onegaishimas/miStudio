name: Sync to Clean Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sync:
    # HARD STOP: only run in Onegaishimas/miStudio
    if: github.repository == 'Onegaishimas/miStudio'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # Always check out main branch, even when triggered by a tag

      - name: Remove excluded files and folders
        if: github.ref_type == 'branch'
        run: |
          rm -rf 0xcc/
          rm -rf .claude/
          rm -f CLAUDE.md
          rm -rf backups/
          # docs/ is dev-internal EXCEPT the vendored public contracts:
          #   docs/schemas/*.json    — frozen interchange schemas
          #   docs/mcp-contract.md   — the generated MCP tool surface
          # Both are required by mirror tests AND by consumers of the public
          # repo. Stripping mcp-contract.md left the mirror's Backend Tests red
          # on EVERY run from 2026-07-26 onward: the test asserts a file the
          # sync deleted, so it could never pass there while the same suite
          # stayed green in this repo.
          find docs/ -mindepth 1 -maxdepth 1 \
            ! -name schemas ! -name mcp-contract.md -exec rm -rf {} +
          rm -rf scripts/
          rm -rf .understand-anything/
          echo "Removed excluded files"

      - name: Commit filtered changes (including workflow updates)
        if: github.ref_type == 'branch'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "Sync from source repository (filtered)"

      - name: Push to clean repository
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/hitsainet/miStudio.git"

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            git push --force "$REMOTE" main
          fi

          # Forward version tags to the clean repo
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git push "$REMOTE" "${GITHUB_REF}"
          fi
